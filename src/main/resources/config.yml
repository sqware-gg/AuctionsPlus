  cancel-complete: "&7Cancelled listing &f#{id}&7. It was returned to your inventory."
  cancel-complete-mail: "&7Cancelled listing &f#{id}&7. Your inventory was full, so it was sent to &f/ah claim&7."
  cancel-denied: "&#ED4245You can only cancel your own active listings."
  admin-cancel-complete: "&7Cancelled listing &f#{id}&7 and returned it to &f{seller}&7."
  listing-expired-returned: "&7Listing &f#{id}&7 expired. &f{item}&7 was returned to your inventory."
  listing-expired-mail: "&7Listing &f#{id}&7 expired. &f{item}&7 was sent to &f/ah claim&7."
  claim-empty: "&#ED4245You have no claim mail."
  claim-inventory-full: "&#ED4245Make room in your inventory first."
  claim-complete: "&7Claimed &f{item}&7."
  saved: "&7Auction data saved."
  reloaded: "&7Auctions+ reloaded."
  status: "&7Listings: &f{active}&7 active, &f{total}&7 total. Claim mail: &f{claims}&7. Economy: &f{economy}&7."
  help-ah: |-
    &fAuctions+ Quick Guide
    &#2b98fd/ah &8or &#2b98fd/auc &8- &7Open the auction house
    &7Buy Now listings have a fixed price. Click one or use &f/ah buy <id>&7.
    &7Timed Auctions take bids until they expire. Click one or use &f/ah bid <id> <amount>&7.
    &7To sell at a fixed price: &f/ah sell <price> [amount] [duration]
    &7To start bidding: &f/ah auction <starting bid> [amount] [duration]
    &7Use &f/ah help sell&7, &f/ah help auction&7, or &f/ah help bid &7for examples.
  usage-ah: |-
    &fAuction House Commands
    &#2b98fd/ah &8or &#2b98fd/auc &8- &7Browse listings
    &#2b98fd/ah sell <price> [amount] [duration] &8- &7List the item in your hand
    &#2b98fd/ah auction <start> [amount] [duration] &8- &7Start a timed bid auction
    &#2b98fd/ah buy <id> &8- &7Buy a fixed-price listing
    &#2b98fd/ah bid <id> <amount> &8- &7Bid on a timed auction
    &#2b98fd/ah active &8- &7Manage your listings
    &#2b98fd/ah claim &8- &7Collect won, bought, or returned items
    &8Tip: &7Durations can be &f30m&7, &f2h&7, or &f3d&7.
  usage-sell: "&7Hold an item, then use &#2b98fd/ah sell <price> [amount] [duration]&7. Example: &f/ah sell 250 16 2d"
  usage-auction: "&7Hold an item, then use &#2b98fd/ah auction <starting bid> [amount] [duration]&7. Example: &f/ah auction 100 1 12h"
  usage-buy: "&7Use &#2b98fd/ah buy <id>&7. You can find listing IDs in &f/ah&7."
  usage-bid: "&7Use &#2b98fd/ah bid <id> <amount>&7. Example: &f/ah bid 12 500"
  usage-claim: "&7Use &#2b98fd/ah claim&7 only when bought, won, returned, or expired items could not fit in your inventory."
  usage-search: "&7Use &#2b98fd/ah search <text>&7. Example: &f/ah search diamond"
  usage-cancel: "&7Use &#2b98fd/ah cancel <id>&7, or open &f/ah active&7."
  usage-admin: |-
    &fAuctions+ Admin Commands
    &#2b98fd/auctionsplus stats &8- &7Show storage and economy status
    &#2b98fd/auctionsplus reload &8- &7Reload config
    &#2b98fd/auctionsplus save &8- &7Save auction data
    &#2b98fd/auctionsplus cancel <id> &8- &7Return a listing to its seller
  usage-admin-cancel: "&7Use &#2b98fd/auctionsplus cancel <id>&7."
