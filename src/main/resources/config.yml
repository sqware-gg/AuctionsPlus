  bidding-disabled: "&#ED4245Bidding auctions are disabled."
  listing-limit: "&#ED4245You already have &f{limit} &#ED4245active listings. Cancel one with &f/ah active&#ED4245."
  listing-fee-failed: "&#ED4245You need &f{fee} &#ED4245for the listing fee."
  listing-created: "&7Listed &f{amount}x {item}&7 for &#2b98fd{price}&7. Manage it in &f/ah active&7."
