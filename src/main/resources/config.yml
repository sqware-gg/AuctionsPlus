# AuctionsPlus
# Used for update checks.
# Do not change unless you know what you are doing.
config-version: 9

economy:
  min-price: 1.0
  # Set to 0 to disable the maximum price limit.
  max-price: 1000000000.0
  allow-buy-own-listings: false

bidding:
  enabled: true
  # Minimum amount a new bid must beat the current bid by.
  min-increment-flat: 1.0
  # Maximum allowed bid. Set to 0 to disable the maximum bid limit.
  max-bid: 1000000000.0

listings:
  default-duration-hours: 72
  max-duration-hours: 168
  max-active-per-player: 20
  expire-check-seconds: 60
  save-interval-seconds: 300
  blacklisted-materials:
    - AIR
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW
    - DEBUG_STICK

fees:
  # Charged when a listing is created. Set to 0 to disable.
  listing-flat: 0.0
  # Removed from the seller payout on successful sale. Set to 0 to disable.
  sale-tax-percent: 0.0

announcements:
  enabled: true
  # Options: all, world, permission, none
  audience: "permission"
  permission: "auctionsplus.notify"
  events:
    listing-created: true
    listing-sold: true
    bid-placed: true
    auction-won: true
    listing-cancelled: false
    listing-expired: false
  messages:
    listing-created: "&f{seller}&7 listed &f{amount}x {item}&7 {price_label} &#2b98fd{price}&7. Use &#2b98fd/ah&7."
    listing-sold: "&f{buyer}&7 bought &f{item}&7 from &f{seller}&7 for &#2b98fd{price}&7."
    bid-placed: "&f{bidder}&7 bid &#2b98fd{bid}&7 on &f{item}&7 by &f{seller}&7. Use &#2b98fd/ah bid {id} {next_bid}&7."
    auction-won: "&f{winner}&7 won &f{item}&7 from &f{seller}&7 for &#2b98fd{price}&7."
    listing-cancelled: "&f{seller}&7 cancelled auction &f#{id}&7 for &f{item}&7."
    listing-expired: "&f{seller}&7's listing for &f{item}&7 expired."

gui:
  title-browse: "&#2b98fdAuctions"
  title-confirm: "&#2b98fdConfirm Purchase"
  title-active: "&#2b98fdYour Listings"
  title-claim: "&#2b98fdClaim Mail"

messages:
  prefix: "&#2b98fdAuctions+ &8> &7"
  no-permission: "&#ED4245You do not have permission to do that."
  permission-check-unavailable: "&#ED4245Your bid was blocked because Auctions+ could not verify your offline bid permission. Join the server or install a Vault permissions provider."
  invalid-player: "&#ED4245That player account could not be verified."
  players-only: "&#ED4245Only players can use that."
  api-unavailable: "&#ED4245Auctions+ is not ready yet."
  economy-unavailable: "&#ED4245No Vault economy provider is available."
  invalid-price: "&#ED4245Enter a price between &f{min} &#ED4245and &f{max}&#ED4245."
  invalid-bid: "&#ED4245Enter a valid bid amount. Example: &f/ah bid 12 500"
  invalid-listing-id: "&#ED4245Enter a valid listing ID. You can see IDs in &f/ah&#ED4245."
  invalid-amount: "&#ED4245Enter an item amount from your hand. Example: &f1&#ED4245, &f8&#ED4245, or &f64&#ED4245."
  invalid-duration: "&#ED4245Use a duration like &f30m&#ED4245, &f2h&#ED4245, or &f3d&#ED4245."
